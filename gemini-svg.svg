<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="70%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#141a2e" />
      <stop offset="70%" stop-color="#0a0d18" />
      <stop offset="100%" stop-color="#05070a" />
    </radialGradient>

    <filter id="glowLarge" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9" result="blur" />
    </filter>
    <filter id="glowMedium" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur" />
    </filter>
    <filter id="glowSmall" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#bgGlow)" />

  <g id="hexagons" stroke-linejoin="miter" stroke-linecap="square">
    <polygon points="256,36 446.5,146 446.5,366 256,476 65.5,366 65.5,146" 
             fill="none" stroke="#00d8ff" stroke-width="14" filter="url(#glowLarge)" opacity="0.4" />
    <polygon points="256,36 446.5,146 446.5,366 256,476 65.5,366 65.5,146" 
             fill="none" stroke="#5ce6ff" stroke-width="6" filter="url(#glowMedium)" opacity="0.7" />
    <polygon points="256,36 446.5,146 446.5,366 256,476 65.5,366 65.5,146" 
             fill="none" stroke="#dffaff" stroke-width="3" filter="url(#glowSmall)" />

    <polygon points="256,61 424.9,158.5 424.9,353.5 256,451 87.1,353.5 87.1,158.5" 
             fill="none" stroke="#00aacc" stroke-width="10" filter="url(#glowLarge)" opacity="0.2" />
    <polygon points="256,61 424.9,158.5 424.9,353.5 256,451 87.1,353.5 87.1,158.5" 
             fill="none" stroke="#2dbfd9" stroke-width="4" filter="url(#glowMedium)" opacity="0.5" />
    <polygon points="256,61 424.9,158.5 424.9,353.5 256,451 87.1,353.5 87.1,158.5" 
             fill="none" stroke="#87d7e6" stroke-width="2" />
  </g>

  <g id="heartbeat" stroke-linejoin="round" stroke-linecap="round">
    <path d="M 116 280 L 176 280 L 196 240 L 221 300 L 256 145 L 276 365 L 311 235 L 331 280 L 391 280" 
          fill="none" stroke="#00ff55" stroke-width="16" filter="url(#glowLarge)" opacity="0.5" />
    <path d="M 116 280 L 176 280 L 196 240 L 221 300 L 256 145 L 276 365 L 311 235 L 331 280 L 391 280" 
          fill="none" stroke="#26ff70" stroke-width="8" filter="url(#glowMedium)" opacity="0.8" />
    <path d="M 116 280 L 176 280 L 196 240 L 221 300 L 256 145 L 276 365 L 311 235 L 331 280 L 391 280" 
          fill="none" stroke="#c2ffdb" stroke-width="4" filter="url(#glowSmall)" />
          
    <circle cx="391" cy="280" r="12" fill="#00ff55" filter="url(#glowLarge)" opacity="0.6" />
    <circle cx="391" cy="280" r="7.5" fill="#38ff7b" filter="url(#glowMedium)" opacity="0.9" />
    <circle cx="391" cy="280" r="4.5" fill="#d9ffea" filter="url(#glowSmall)" />
  </g>
</svg>
