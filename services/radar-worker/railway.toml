# Config-as-code pour le service Railway `radar-worker` (projet radar-worker, environnement production).
# Documente ce qui est aujourd'hui configuré à la main dans le dashboard (voir docs/deployment.md §6
# et docs/audit-2026-09-infrastructure.md §1.2) — ne change pas la commande de démarrage.
#
# Restent configurés UNIQUEMENT dans le dashboard Railway, pas ici :
#   - le port du domaine public (8091, `railway domain update --port 8091`)
#   - le volume persistant `radar-worker-volume` monté sur /data (5 Go)
#   - les variables d'environnement applicatives (METEO_FRANCE_RADAR_API_KEY, RADAR_WORKER_TOKEN,
#     RADAR_STORAGE_DIR, RADAR_PUBLIC_BASE_URL, RADAR_RAW_RETENTION, RADAR_RASTER_RETENTION)
# La commande de démarrage reste celle du Dockerfile (CMD ["/entrypoint.sh"]) : cette configuration
# ne définit volontairement aucun `startCommand`.

[build]
builder = "DOCKERFILE"
# Chemin relatif à ce fichier (le service Railway est déployé avec `railway up`
# exécuté depuis services/radar-worker, qui est donc sa racine).
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
