<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>France Monitor - Hors Ligne</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0a0a0f;
      --panel: #11131b;
      --border: rgba(255, 255, 255, 0.1);
      --text: #ffffff;
      --muted: rgba(255, 255, 255, 0.6);
      --accent: #4bfc94;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 24px;
    }
    .icon {
      margin-bottom: 24px;
    }
    .icon img {
      width: 96px;
      height: 96px;
      border-radius: 16px;
      opacity: 0.9;
    }
    h1 {
      font-size: clamp(1.75rem, 4vw, 2rem);
      margin: 0 0 12px;
      line-height: 1.2;
      letter-spacing: -0.02em;
    }
    p {
      color: var(--muted);
      margin: 0 0 16px;
      max-width: 420px;
      line-height: 1.6;
    }
    button {
      background-color: var(--accent);
      color: #000;
      border: none;
      border-radius: 8px;
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
      margin-top: 8px;
    }
    button:hover {
      opacity: 0.85;
    }
  </style>
</head>
<body>
  <div class="icon">
    <img src="/icon.svg" alt="France Monitor"/>
  </div>
  <h1>Vous êtes hors ligne</h1>
  <p>France Monitor a besoin d'une connexion internet pour charger les dernières données d'intelligence.</p>
  <p>Vérifiez votre connexion et essayez de recharger la page.</p>
  <button onclick="window.location.reload()">Réessayer</button>
</body>
</html>
