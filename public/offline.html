<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>France Monitor - Hors Ligne</title>
  <style>
    :root {
      --bg-color: #0a0a0f;
      --text-main: #ffffff;
      --text-muted: rgba(255, 255, 255, 0.6);
      --accent: #5ac8fa;
    }
    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
    }
    h1 {
      font-size: 2rem;
      margin-bottom: 8px;
    }
    p {
      color: var(--text-muted);
      margin-bottom: 24px;
      max-width: 400px;
      line-height: 1.5;
    }
    .icon img {
      width: 96px;
      height: 96px;
      margin-bottom: 16px;
      opacity: 0.9;
    }
    button {
      background-color: var(--accent);
      color: #000;
      border: none;
      border-radius: 8px;
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <div class="icon"><img src="icon-512.png" alt="France Monitor"/></div>
  <h1>Vous êtes hors ligne</h1>
  <p>France Monitor a besoin d'une connexion internet pour charger les dernières données d'intelligence.</p>
  <p>Vérifiez votre connexion et essayez de recharger la page.</p>
  <button onclick="window.location.reload()">Réessayer</button>
</body>
</html>
