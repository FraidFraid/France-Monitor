name: Smoke test production

# Test de fumée quotidien de la production (VM Oracle derrière Cloudflare, voir docs/deployment-oracle.md) :
# chaque route /api/* doit répondre en JSON (pas le HTML de repli de la SPA : c'est ainsi que /api/ministers/* et
# /api/gie/* sont restés morts en prod sans erreur visible, docs/audit-2026-09-infrastructure.md § 1.1 constat 3),
# les résumés IA ne doivent pas être dégradés, le worker radar et le relais AIS de la VM doivent répondre.
# Un échec planifié ouvre (ou complète) un ticket « Test de fumée production en échec » : GitHub prévient le
# propriétaire du dépôt par courriel. Le premier passage entièrement vert ferme le ticket.

on:
  schedule:
    - cron: '17 6 * * *'   # une fois par jour ; heure décalée pour éviter les pics de cron GitHub
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

env:
  # Variables de dépôt, avec repli sur les adresses de la VM.
  SITE: ${{ vars.SITE_URL || 'https://www.francemonitor.com' }}
  RADAR_WORKER: ${{ vars.RADAR_WORKER_URL || 'https://www.francemonitor.com/radar' }}
  AIS_RELAY: ${{ vars.AIS_RELAY_URL || 'https://www.francemonitor.com/relay' }}

jobs:
  smoke:
    name: Smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Vérifier les routes /api/* de production
        id: api
        run: |
          set -u
          fail=0
          summary="${GITHUB_STEP_SUMMARY:-/dev/null}"
          echo "## Résultat du test de fumée production" >> "$summary"
          echo "" >> "$summary"
          echo "| Route | Statut HTTP attendu | Statut obtenu | Content-Type | Résultat |" >> "$summary"
          echo "|---|---|---|---|---|" >> "$summary"

          # path;expected_status — content-type attendu : toujours application/json ici
          routes=(
            "/api/news?limit=3;200"
            "/api/news/history;200"
            "/api/environment/vigilance;200"
            "/api/energy/ecowatt;200"
            "/api/energy/biogas-sites;200"
            "/api/traffic/air;200"
            "/api/environment/fires;200"
            "/api/environment/floods;200"
            "/api/environment/flood-zones?bbox=4.05,43.65,4.15,43.75;200"
            "/api/environment/drought;200"
            "/api/environment/air;200"
            "/api/environment/pollen;200"
            "/api/environment/earthquakes;200"
            "/api/environment/disasters;200"
            "/api/environment/ems;200"
            "/api/social/protests;200"
            "/api/environment/sea-levels;200"
            "/api/sovereignty/military;200"
            "/api/sovereignty/cables-watch;200"
            "/api/sovereignty/cyber;200"
            "/api/sovereignty/vigipirate;200"
            "/api/sovereignty/gnss;200"
            "/api/sovereignty/connectivity;200"
            "/api/sovereignty/sanctions;200"
            "/api/finance/market;200"
            "/api/finance/stability;200"
            "/api/outages/telecom;200"
            "/api/outages/power;200"
            "/api/outages/internet;200"
            "/api/outages/cloud;200"
            "/api/outages/now;200"
            "/api/outages/journal;200"
            "/api/rte-iip;200"
            "/api/ministers/composition;200"
            "/api/energy/drom;200"
            "/api/gie/agsi;200"
            "/api/gie/alsi;200"
            "/api/opendata-proxy?url=https%3A%2F%2Fgeo.api.gouv.fr%2Fregions;200"
            "/api/health-check;200"
          )

          for entry in "${routes[@]}"; do
            path="${entry%;*}"
            expected="${entry#*;}"
            url="$SITE$path"
            body=$(mktemp)
            headers=$(mktemp)
            code=$(curl -s -o "$body" -D "$headers" -w "%{http_code}" --max-time 30 "$url") || code="000"
            ctype=$(grep -i '^content-type:' "$headers" | head -1 | cut -d' ' -f2- | tr -d '\r' | cut -d';' -f1)

            result="OK"
            if [ "$code" != "$expected" ]; then
              result="FAIL (HTTP $code)"
              fail=1
            elif [ "$ctype" != "application/json" ]; then
              result="FAIL (content-type: ${ctype:-aucun}, attendu application/json — probablement le repli SPA HTML)"
              fail=1
            fi

            echo "$path -> $result"
            echo "| \`$path\` | $expected | $code | ${ctype:-—} | $result |" >> "$summary"
            rm -f "$body" "$headers"
          done

          echo "" >> "$summary"

          echo "### /api/health-check" >> "$summary"
          health_body=$(curl -s --max-time 30 "$SITE/api/health-check") || health_body="{}"
          status=$(echo "$health_body" | jq -r '.status // "inconnu"')
          echo "statut rapporté : \`$status\`" >> "$summary"
          if [ "$status" = "down" ]; then
            echo "::error::/api/health-check rapporte status=down"
            fail=1
          fi

          if [ "$fail" -ne 0 ]; then
            echo "::error::au moins une route /api/* a échoué le test de fumée (voir le résumé du job)"
          fi
          exit $fail

      - name: Vérifier que les résumés IA ne sont pas dégradés (Groq)
        if: always()
        # Un modèle Groq retiré ne casse rien de visible : chaque appel retombe sur son repli et
        # répond 200. Constaté le 23/09/2026 (llama-3.3-70b-versatile retiré). On vérifie donc le
        # champ `degraded` d'un vrai résumé. Le texte change chaque jour pour éviter le cache Redis 24 h.
        run: |
          set -u
          day=$(date -u +%Y-%m-%d)
          payload=$(jq -n --arg d "$day" '{text: ("Test de fumée du " + $d + " : la préfecture de Gironde a déclenché le plan ORSEC après des inondations touchant vingt communes, avec 150 interventions des pompiers.")}')
          body=$(curl -s --max-time 60 -X POST -H 'content-type: application/json' -d "$payload" "$SITE/api/intelligence/v1/summarize") || body='{}'
          echo "$body" | head -c 400; echo
          degraded=$(echo "$body" | jq -r '.degraded // false')
          summary=$(echo "$body" | jq -r '.summary // ""')
          echo "### Résumé IA (Groq) : degraded=$degraded" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          if [ "$degraded" = "true" ] || [ -z "$summary" ]; then
            echo "::error::le résumé IA est dégradé : Groq en échec (modèle retiré, clé, quota ?) — voir api/_lib/groq-models.js"
            exit 1
          fi

      - name: Vérifier le worker radar (VM) /health
        if: always()
        run: |
          set -u
          code=$(curl -s -o /tmp/radar-health.json -w "%{http_code}" --max-time 30 "$RADAR_WORKER/health") || code="000"
          echo "Worker radar /health -> HTTP $code"
          cat /tmp/radar-health.json 2>/dev/null || true
          echo ""
          echo "### Worker radar (VM) /health : HTTP $code" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          if [ "$code" != "200" ]; then
            echo "::error::worker radar (VM) /health a répondu HTTP $code"
            exit 1
          fi

      - name: Vérifier le relais AIS (VM) /health
        if: always()
        run: |
          set -u
          code=$(curl -s -o /tmp/ais-health.json -w "%{http_code}" --max-time 30 "$AIS_RELAY/health") || code="000"
          echo "Relais AIS /health -> HTTP $code"
          cat /tmp/ais-health.json 2>/dev/null || true
          echo ""
          echo "### Relais AIS /health : HTTP $code" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          if [ "$code" != "200" ]; then
            echo "::error::relais AIS /health a répondu HTTP $code"
            exit 1
          fi

      - name: Vérifier l'instantané maritime /snapshot
        if: always()
        run: |
          set -u
          code=$(curl -s -o /tmp/ais-snapshot.json -w "%{http_code}" --max-time 30 "$AIS_RELAY/snapshot") || code="000"
          echo "Relais AIS /snapshot -> HTTP $code"
          echo "### Relais AIS /snapshot : HTTP $code" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          if [ "$code" != "200" ] || ! grep -q '"lastMessageAt"' /tmp/ais-snapshot.json; then
            echo "::error::instantané maritime absent ou illisible (HTTP $code)"
            exit 1
          fi

      - name: Ouvrir ou compléter le ticket d'échec
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -u
          title="Test de fumée production en échec"
          num=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$num" ]; then
            gh issue comment "$num" --body "Toujours en échec le $(date -u +%d/%m/%Y) : $RUN_URL"
          else
            gh issue create --title "$title" --body "Le test de fumée quotidien a échoué le $(date -u +%d/%m/%Y). Détail des routes dans le résumé du passage : $RUN_URL

          Ce ticket se ferme seul au premier passage entièrement vert."
          fi

      - name: Fermer le ticket d'échec
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -u
          title="Test de fumée production en échec"
          for num in $(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[].number'); do
            gh issue close "$num" --comment "Test de fumée de nouveau vert le $(date -u +%d/%m/%Y) : $RUN_URL"
          done
