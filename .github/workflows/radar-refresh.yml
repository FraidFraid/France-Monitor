name: Radar refresh

# Le décodage eccodes du BUFR exige plusieurs Go de RAM : trop pour le
# worker Railway (8 Go dépassés, OOM), assez pour les runners publics
# GitHub (16 Go). Le runner décode et rend l'image, puis la pousse au
# worker qui ne fait que servir manifest + raster.

on:
  schedule:
    # Mosaïques DPRadar toutes les 5 min ; le cron GitHub est best-effort
    # (dérive possible de quelques minutes, le panneau affiche l'âge réel).
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

concurrency:
  group: radar-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: services/radar-worker/requirements.txt

      - name: Installer les dépendances du worker
        run: pip install -r services/radar-worker/requirements.txt

      - name: Décoder le BUFR et publier vers le worker
        working-directory: services/radar-worker
        env:
          METEO_FRANCE_RADAR_API_KEY: ${{ secrets.METEO_FRANCE_RADAR_API_KEY }}
          RADAR_WORKER_TOKEN: ${{ secrets.RADAR_WORKER_TOKEN }}
          RADAR_PUBLISH_BASE_URL: https://radar-worker-production-0c93.up.railway.app
        run: python publish_job.py
